spec:
  inputs:
    cudnn_version:
    cuda_version:
---    
"build:$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]":
  image: "gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]"
  stage: build
  needs: []
  extends:
    - .build:template

"cpp_samples:cudnn_$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]":
  image: "gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]"
  needs: ["build:$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]"]
  parallel:
    matrix:
      - ARCH: ["Hopper", "Ampere"]
  tags:
    - ${ARCH}
  extends:
    - .cpp_samples:template

"python_tests:cudnn_$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]":
  image: "gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]"
  needs: ["build:$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]"]
  parallel:
    matrix:
      - ARCH: ["Hopper", "Ampere"]
  tags:
    - ${ARCH}
  script:
    - export PYTHONPATH=build
    - pytest test/python -n 4 --tb=short --junit-xml=result-junit.xml
  extends:
    - .python_tests:template

"cpp_tests:cudnn_$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]":
  image: "gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]"
  needs: ["build:$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]"]
  parallel:
    matrix:
      - ARCH: ["Hopper", "Ampere"]
  tags:
    - ${ARCH}
  artifacts:
    when: always
    reports:
      junit: result-junit.xml
  extends:
    - .cpp_tests:template

"pycudnntest:cudnn_$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]":
  image: "gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]"
  needs: ["build:$[[inputs.cudnn_version]]_$[[inputs.cuda_version]]"]
  parallel:
    matrix:
      - ARCH: ["Hopper", "Ampere"]
  tags:
    - ${ARCH}
  extends: .pycudnntest:template


deploy:build_bdist_wheels:
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:pip_wheels_cuda_12.8_cudnn_9.8.0
    tags:
        - wheel_builder
    needs: []
    stage: deploy
    script:
        - ci/build_pip_wheels.sh
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"
    artifacts:
        paths:
            - many_linux_wheels/*.whl

.windows_wheel_builder_template:
    tags:
        - windows_wheel_builder
    needs: []
    stage: deploy
    script:
        - if (-not (conda env list | Select-String -Pattern "py${PYTHON_VERSION}")) { conda create -n "py${PYTHON_VERSION}" -y python=${PYTHON_FULL_VERSION} }
        - "& C:\\tools\\Anaconda3\\Scripts\\conda.exe init powershell"
        - ". C:\\tools\\Anaconda3\\shell\\condabin\\conda-hook.ps1"
        - "conda activate py${PYTHON_VERSION}"
        - $Env:CUDNN_PATH = "C:\Users\Public\Downloads\cudnn-9.8.0.87"
        - python --version
        - python -m pip wheel --no-deps . -w ./wheels/py${PYTHON_VERSION}
        - conda deactivate
        - $wheel = Get-ChildItem -Path "./wheels/py${PYTHON_VERSION}/*${version}*.whl" | Select-Object -ExpandProperty Name
        - $DATE_FOLDER = Get-Date -Format "yyyy-MM-dd"
        - if ($CI_COMMIT_BRANCH -eq "main") { Write-Host "main branch" Invoke-WebRequest -Uri "https://urm.nvidia.com/artifactory/hw-cudnn-generic/CUDNN/cudnn_frontend/main/${DATE_FOLDER}/${wheel_name}" ` -Method Put ` -InFile "./wheels/py${PYTHON_VERSION}/${wheel}" ` -Headers @{Authorization = "Basic " + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("agopal:${JFROG_API_KEY}"))}} elseif ($CI_COMMIT_BRANCH -eq "develop") { Write-Host "develop branch" Invoke-WebRequest -Uri "https://urm.nvidia.com/artifactory/hw-cudnn-generic/CUDNN/cudnn_frontend/develop/latest/${wheel_name}" ` -Method Put ` -InFile "./wheels/py${PYTHON_VERSION}/${wheel}" ` -Headers @{Authorization = "Basic " + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("agopal:${JFROG_API_KEY}"))}} else { Write-Host $CI_COMMIT_BRANCH Write-Host "Not posting ${wheel} to artifactory"}
    rules:
        # - if: $CI_PIPELINE_SOURCE == "schedule"
    artifacts:
        paths:
            - wheels/py${PYTHON_VERSION}/*.whl

deploy:build_bdist_wheels_3.12:
    extends: .windows_wheel_builder_template
    variables:
        PYTHON_VERSION: "312"
        PYTHON_FULL_VERSION: "3.12.7"


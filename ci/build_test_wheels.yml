deploy:test_bdist_wheels_ga_cudnn_3.10:
    parallel:
        matrix:
            - ARCH: ["Hopper", "Ampere"]
    tags:
        - ${ARCH}
    needs: ["deploy:build_bdist_wheels"]
    stage: deploy
    extends:
        - .cudnn_ga_image:template
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"
    script:
        - apt-get update
        - apt-get install -y software-properties-common
        - add-apt-repository ppa:deadsnakes/ppa
        - apt-get update
        - apt-get -y install python3-pip
        - pip uninstall -y nvidia_cudnn_frontend
        - ls many_linux_wheels/*.whl
        - pip install -v --find-links many_linux_wheels/ nvidia_cudnn_frontend
        - pip install -r /tmp/requirements.txt
        - pip uninstall -y nvidia-cudnn-cu12 # Only removing it because the test is meant for 8907
        - pytest test/python -n 4

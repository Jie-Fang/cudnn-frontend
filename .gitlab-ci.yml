variables:
  DOCKER_HOST: tcp://localhost:2376
  DOCKER_TLS_CERTDIR: ""

stages:
  - build
  - test

make:
    tags:
    - cudnn-frontend-runner
    stage: build
    script: 
        - "docker build -t cudnn_frontend  . "
    
run:
    tags:
    - cudnn-frontend-runner
    stage: test
    script:
        - docker run --gpus all -it --name=sample cudnn_frontend /samples/conv_sample
        - docker rm -v sample
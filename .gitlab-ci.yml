variables:
  DOCKER_HOST: tcp://localhost:2376
  DOCKER_TLS_CERTDIR: ""

stages:
  - build
  - build_v8.1
  - test

make:
    tags:
    - cudnn-frontend-runner
    stage: build
    script: 
        - "docker build -t cudnn_frontend  . "

make_v8.1:
    tags:
    - cudnn-frontend-runner
    stage: build_v8.1
    script: 
        - "docker build -t cudnn_frontend  -f Dockerfile.8.1 . "
    
run:
    tags:
    - cudnn-frontend-runner
    stage: test
    script:
        - nvidia-smi
        - docker container prune -f
        - docker run --gpus all -i --name=samples cudnn_frontend /build/Samples
        - docker rm -v samples

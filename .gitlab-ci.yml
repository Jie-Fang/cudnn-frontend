thunder:cudnn_8.9.2.31:
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:lightning-py3.10-cuda12.1.1
    needs: []
    parallel:
        matrix:
            - ARCH: ["Hopper", "Ampere"]
    tags:
        - ${ARCH}
    before_script:
        - pip install nvidia-cudnn-cu12==8.9.2.26
        - export CUDNN_PATH=/usr/local/lib/python3.10/dist-packages/nvidia/cudnn
        - CMAKE_BUILD_PARALLEL_LEVEL=16 pip install . -v
    extends:
        - .thunder:template


thunder:pjnl_latest:
    image: gitlab-master.nvidia.com:5005/dl/pytorch/update-scripts:pjnl-latest
    stage: thunder
    needs: []
    parallel:
        matrix:
            - ARCH: ["Hopper", "Ampere"]
    tags:
        - ${ARCH}
    script:
        # Install cudnn_frontend
        - cd /opt/cudnn/cudnn_frontend
        - git checkout develop
        - pip install -v .
        # Run cudnnex tests in thunder
        - cd /opt/pytorch/lightning-thunder
        - pytest thunder/tests/test_cudnn_executor.py -v
    only:
        - schedules
   
build:cudnn_GA_windows:
    tags:
        - Windows
    needs: []
    stage: build
    script:
        # Enable below lines to fetch latest cudnn if needed,
        # Otherwise just use already downloaded cudnn_8.9.5.29
        # - wget https://urm.nvidia.com/artifactory/hw-cudnn-generic/CUDNN/v8.9_cuda_12.2/8.9.5.29/cudnn-windows-x86_64-8.9.5.29.zip -O cudnn.zip
        # - Expand-Archive .\cudnn.zip
        - $Env:CUDNN_PATH = "C:\Users\Public\Downloads\cudnn-9.8.0.87"
        - mkdir build
        - cd build
        - cmake ../
        - cmake --build . -j16 --verbose
    extends:
        - .default_job_template

python_samples:cudnn_dev_latest:
    stage: python_samples
    script:
        - !reference [.fetch_cudnn_dev:template, before_script]
        - pip install -v .
        - ci/run_python_samples.sh
    needs: []
    extends:
        - .default_job_template
        - .device_matrix:template
        - .cudnn_dev_image:template    



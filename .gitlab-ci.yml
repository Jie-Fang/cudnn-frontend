deploy:build_bdist_wheels:
    tags:
        - wheel_builder
    needs: []
    stage: deploy
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:pip_wheels_cuda_12.5_cudnn_9.4.0
    script:
        - ci/build_pip_wheels.sh
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"
    artifacts:
        paths:
            - many_linux_wheels/*.whl

deploy:test_bdist_wheels_8.9.7_3.10:
    parallel:
        matrix:
            - ARCH: ["Hopper", "Ampere"]
    tags:
        - ${ARCH}
    needs: ["deploy:build_wheels"]
    stage: deploy
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_8.9.7.29_12.2.2
    needs: ["deploy:build_bdist_wheels"]
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"
    script:
        - apt-get update
        - apt-get install -y software-properties-common
        - add-apt-repository ppa:deadsnakes/ppa
        - apt-get update
        - apt-get -y install python3.10 python3-pip python3.10-distutils
        - update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 2
        - update-alternatives --install /usr/bin/python python /usr/bin/python3.10 2
        - pip uninstall -y nvidia_cudnn_frontend
        - pip install -v --find-links many_linux_wheels/ nvidia_cudnn_frontend
        - pip install -r /tmp/requirements.txt
        - pip uninstall -y nvidia-cudnn-cu12 # Only removing it because the test is meant for 8907
        - pytest test/python -n 4 --tb=short

deploy:test_bdist_wheels_9.4.0_3.10:
    parallel:
        matrix:
            - ARCH: ["Hopper", "Ampere"]
    tags:
        - ${ARCH}
    needs: ["deploy:build_wheels"]
    stage: deploy
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_9.4.0.58_12.6.0
    needs: ["deploy:build_bdist_wheels"]
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"
    script:
        - apt-get update
        - apt-get install -y software-properties-common
        - add-apt-repository ppa:deadsnakes/ppa
        - apt-get update
        - apt-get -y install python3.10 python3-pip python3.10-distutils
        - update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 2
        - update-alternatives --install /usr/bin/python python /usr/bin/python3.10 2
        - pip uninstall -y nvidia_cudnn_frontend
        - ls many_linux_wheels/*.whl
        - pip install -v --find-links many_linux_wheels/ nvidia_cudnn_frontend
        - pip install -r /tmp/requirements.txt
        - pip uninstall -y nvidia-cudnn-cu12 # Only removing it because the test is meant for 8907
        - pytest test/python -n 4 --tb=short

analysis:clang-format:
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_12.3.1
    stage: analysis
    allow_failure: true
    script:
        - ci/run_style_check_diff.sh
        
analysis:check-relative-includes:
    image: nvidia/cuda:12.1.1-cudnn8-devel-ubuntu22.04
    stage: analysis
    script:
        - echo "#include \"$CI_PROJECT_DIR/include/cudnn_frontend.h\"" > test_build.cpp
        - echo 'int main() { return 0; }' >> test_build.cpp
        - g++ -o test_build test_build.cpp -std=c++17 -I/usr/local/cuda/include/ -L/usr/lib/x86_64-linux-gnu/ -lcudnn


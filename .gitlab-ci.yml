thunder:pjnl_latest:
    image: gitlab-master.nvidia.com:5005/dl/pytorch/update-scripts:pjnl-latest
    stage: thunder
    needs: []
    parallel:
        matrix:
            - ARCH: ["Hopper", "Ampere"]
    tags:
        - ${ARCH}
    script:
        # Install cudnn_frontend
        - cd /opt/cudnn/cudnn_frontend
        - git checkout develop
        - pip install -v .
        # Run cudnnex tests in thunder
        - cd /opt/pytorch/lightning-thunder
        - pytest thunder/tests/test_cudnn_executor.py -v
    only:
        - schedules

analysis:cudnn_clang_disable_exception:
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_12.5.0
    needs: []
    stage: analysis
    script:
        - apt-get update && apt-get install -y clang
        - !reference [.fetch_cudnn_dev:template, before_script]
        - mkdir build && cd build
        - CC=/usr/bin/clang CXX=/usr/bin/clang++ cmake -DCMAKE_CXX_FLAGS="-DNV_CUDNN_DISABLE_EXCEPTION" ../
        - cmake --build . -j16 --verbose
        
analysis:cudnn_v9_no_half_conversion:
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_8.9.7.29_12.2.2
    needs: []
    stage: analysis
    script:
        - mkdir build && cd build
        - cmake -DCMAKE_CXX_FLAGS="-D__CUDA_NO_HALF_CONVERSIONS__" ../
        - cmake --build . -j16 --verbose
    

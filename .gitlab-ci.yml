workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
    interruptible: true

.default_job_template:
  rules:
    # CI_MERGE_REQUEST_DRAFT is not available in older GitLab versions (requires 17.10+), commented until GitLab is upgraded
    # - if: $CI_MERGE_REQUEST_DRAFT == "true"
    #   when: never
    # Workaround: Check MR title for draft prefixes (Draft:, WIP:, [WIP])
    - if: $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "merge_request_event"

.manual_job_template:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"

.cudnn_dev_image:template:
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_13.2.0

.cudnn_rel_image:template:
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_13.2.0

.cudnn_ga_image:template:
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_9.20.0.48_13.2.0

.device_matrix:template:
    parallel:
        matrix:
            - ARCH: ["Hopper", "Ampere", "Blackwell"]
    tags:
        - ${ARCH}

.fetch_cudnn_dev:template:
    cache:
        - key: dev_cudnn_9_22_cuda_13_2
          paths:
              - downloads
    before_script:
        - mkdir -p downloads
        - ls -1 downloads/
        - python3 ci/fetch_cudnn.py --base-url https://urm.nvidia.com/artifactory/hw-cudnn-generic/CUDNN/v9.22 --cuda-version 13.2
        - find /debug_cudnn
        - export CUDNN_PATH=/debug_cudnn # This is required for source building FE
        - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/debug_cudnn/lib64 # This is required for dlopening BE
        - export CUDNN_VERSION_=$(ls /debug_cudnn/lib/libcudnn.so.*.*.* | sed 's/.*libcudnn\.so\.//')

.fetch_cudnn_rel:template:
    cache:
        - key: rel_cudnn_9_21_cuda_13_2
          paths:
              - downloads
    before_script:
        - mkdir -p downloads
        - ls -1 downloads
        - python3 ci/fetch_cudnn.py --base-url https://urm.nvidia.com/artifactory/hw-cudnn-generic/CUDNN/v9.21 --cuda-version 13.2
        - find /debug_cudnn
        - export CUDNN_PATH=/debug_cudnn # This is required for source building FE
        - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/debug_cudnn/lib64 # This is required for dlopening BE
        - export CUDNN_VERSION_=$(ls /debug_cudnn/lib/libcudnn.so.*.*.* | sed 's/.*libcudnn\.so\.//')

.build:template:
    stage: build
    script:
        - ci/build.sh
    tags:
        - Blackwell
    artifacts:
        paths:
            - build/

.cpp_samples:template:
    stage: cpp_samples
    script:
        - ci/run_cpp_samples.sh

.oss_tests:template:
    stage: oss_tests
    allow_failure: true
    script:
        - pip install -v .[cutedsl]
        - ci/run_test_oss.sh

.python_tests:template:
    stage: python_tests
    script:
        - ci/run_python_tests.sh

.mha_v1_tests:template:
    stage: mha_v1_tests
    script:
        - ci/run_test_mhas_v1.sh

.mha_v2_tests:template:
    stage: mha_v2_tests
    script:
        - ci/run_test_mhas_v2.sh

.pycudnntest:template:
    stage: pycudnnTest
    script:
        - ci/run_pycudnntest.sh

.cpp_tests:template:
    stage: cpp_tests
    script:
        - ci/run_cpp_tests.sh

.python_samples:template:
    stage: python_samples
    script:
        - pip install -v .
        - ci/run_python_samples.sh

.L4_graph_runner_large:template:
    stage: L4_graph_runner
    script:
        - ci/run_L4_streams.sh

include:
  - 'ci/build_test_wheels.yml'
  - 'ci/analysis.yml'

  - local: ci/job-template.yml
    inputs:
        cuda_version: "13.1.0"
        cudnn_version: "9.19.0.56"
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"

stages:
    - analysis
    - build
    - cpp_samples
    - oss_tests
    - cpp_tests
    - python_samples
    - python_tests
    - mha_v1_tests
    - mha_v2_tests
    - backend_triggers
    - pycudnnTest
    - L4_graph_runner
    - deploy
    - notify

# ==============================================================================
# Dev builds (cuDNN dev latest)
# ==============================================================================

build:dev:
    needs: []
    extends:
        - .default_job_template
        - .cudnn_dev_image:template
        - .fetch_cudnn_dev:template
        - .build:template

cpp_test:dev:
    extends:
        - .default_job_template
        - .device_matrix:template
        - .cudnn_dev_image:template
        - .fetch_cudnn_dev:template
        - .cpp_tests:template
    needs: ["build:dev"]

py_test:dev:
    extends:
        - .default_job_template
        - .device_matrix:template
        - .cudnn_dev_image:template
        - .fetch_cudnn_dev:template
        - .python_tests:template
    needs: ["build:dev"]

mha_v1:dev:
    extends:
        - .default_job_template
        - .device_matrix:template
        - .cudnn_dev_image:template
        - .fetch_cudnn_dev:template
        - .mha_v1_tests:template
    needs: ["build:dev"]

pycudnn:dev:
    extends:
        - .default_job_template
        - .device_matrix:template
        - .cudnn_dev_image:template
        - .fetch_cudnn_dev:template
        - .pycudnntest:template
    needs: ["build:dev"]

L4:dev:
    extends:
        - .device_matrix:template
        - .cudnn_dev_image:template
        - .fetch_cudnn_dev:template
        - .L4_graph_runner_large:template
    needs: ["build:dev"]
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"


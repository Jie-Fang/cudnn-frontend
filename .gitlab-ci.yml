default:
    interruptible: true

before_script:
    - nvidia-smi
    - echo "CUDA_VERSION=$CUDA_VERSION"
    - echo "CUDNN_VERSION=$CUDNN_VERSION"

.default_job_template:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "merge_request_event"

.manual_job_template:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"

.cudnn_dev_image:template:
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_13.1.0

.cudnn_rel_image:template:
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_13.1.0

.cudnn_ga_image:template:
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_9.17.1.4_13.1.0

.device_matrix:template:
    parallel:
        matrix:
            - ARCH: ["Hopper", "Ampere", "Blackwell"]
    tags:
        - ${ARCH}

.fetch_cudnn_dev:template:
    cache:
        - key: dev_cudnn_9_19_cuda_13_1
          paths:
              - downloads
    before_script:
        - mkdir -p downloads
        - ls -1 downloads/
        - python3 ci/fetch_cudnn.py https://urm.nvidia.com/artifactory/hw-cudnn-generic/CUDNN/v9.19 13.1
        - find /debug_cudnn
        - export CUDNN_PATH=/debug_cudnn # This is required for source building FE
        - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/debug_cudnn/lib64 # This is required for dlopening BE

.fetch_cudnn_rel:template:
    cache:
        - key: rel_cudnn_9_18_cuda_13_1
          paths:
              - downloads
    before_script:
        - mkdir -p downloads
        - ls -1 downloads
        - python3 ci/fetch_cudnn.py https://urm.nvidia.com/artifactory/hw-cudnn-generic/CUDNN/v9.18 13.1
        - find /debug_cudnn
        - export CUDNN_PATH=/debug_cudnn # This is required for source building FE
        - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/debug_cudnn/lib64 # This is required for dlopening BE

.build:template:
    stage: build
    script:
        - ci/build.sh
    tags:
        - Blackwell
    # keep the build directory so that later jobs can use it
    artifacts:
        paths:
            - build/

.cpp_samples:template:
    stage: cpp_samples
    script:
        - ci/run_cpp_samples.sh

.oss_tests:template:
    stage: oss_tests
    allow_failure: true
    script:
        - pip install -v .[cutedsl]
        - ci/run_test_oss.sh

.python_tests:template:
    stage: python_tests
    script:
        - ci/run_python_tests.sh

.mha_v2_tests:template:
    stage: mha_v2_tests
    script:
        - ci/run_test_mhas_v2.sh

.pycudnntest:template:
    stage: pycudnnTest
    script:
        - ci/run_pycudnntest.sh

.cpp_tests:template:
    stage: cpp_tests
    script:
        - ci/run_cpp_tests.sh

.python_samples:template:
    stage: python_samples
    script:
        - pip install -v .
        - ci/run_python_samples.sh

.L4_graph_runner:template:
    stage: L4_graph_runner
    script:
        - ci/run_L4_graph_runner.sh

.L4_graph_runner_large:template:
    stage: L4_graph_runner
    script:
        - ci/run_L4_streams.sh


variables:
  GIT_SUBMODULE_STRATEGY: recursive

stages:
    - build
    - cpp_tests
    - python_tests

.build:template:
    script:
        - ci/build.sh
    # keep the build directory so that later jobs can use it
    artifacts:
        paths:
            - build/
        expire_in: 1 week

.test:template:
    stage: cpp_tests
    script:
        - ci/run_cpp_tests.sh
    # Upload test report to gitlab
    artifacts:
        when: always
        reports:
            junit: build/result-junit.xml
        expire_in: 1 week

.pytest:template:
    stage: python_tests
    script:
        - ci/run_python_tests.sh

build:cudnn_8.6.0.163:
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cuda_11.8_cudnn_8.6.0.163_torch
    stage: build
    parallel:
        matrix:
            - ARCH: ["Hopper", "Ampere", "GA10x"]
    tags:
        - ${ARCH}
    extends: .build:template

test:cudnn_8.6.0.163:GA10x:
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cuda_11.8_cudnn_8.6.0.163_torch
    extends: .test:template
    dependencies: ["build:cudnn_8.6.0.163: [GA10x]"]
    tags:
        - GA10x
    needs:
        - ["build:cudnn_8.6.0.163: [GA10x]"]


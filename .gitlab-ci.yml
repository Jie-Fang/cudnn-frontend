.fetch_cudnn_dev:template:
    before_script:
        - BASE_URL=https://urm.nvidia.com/artifactory/hw-cudnn-generic/CUDNN/v9.6_cuda_12.6/
        - LATEST_DATE_TIME=`curl -S $BASE_URL 2> /dev/null | grep "9.6.0" | grep href |  awk -F\  '{print $3, $4}' | sort -n -t- -k3,3 -k2,2M -k1,1n | tail -1`
        - LATEST_VER=`curl -S $BASE_URL 2> /dev/null | grep "$LATEST_DATE_TIME" | awk -F'["/]' '{print $2}'`
        - echo ${LATEST_DATE_TIME} ${LATEST_VER} ${BASE_URL}${LATEST_VER}/debug_cudnn-linux-x86_64-${LATEST_VER}.tar.gz
        - wget -q --password ${JFROG_API_KEY} ${BASE_URL}${LATEST_VER}/debug_cudnn-linux-x86_64-${LATEST_VER}.tar.gz -O cudnn.tar.gz
        - tar xvf cudnn.tar.gz --directory /
        - export CUDNN_PATH=/debug_cudnn # This is required for source building FE
        - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/debug_cudnn/lib64 # This is required for dlopening BE
  
.fetch_cudnn_rel:template:
    before_script:
        - BASE_URL=https://urm.nvidia.com/artifactory/hw-cudnn-generic/CUDNN/v9.5_cuda_12.6/
        - LATEST_DATE_TIME=`curl -S $BASE_URL 2> /dev/null | grep "9.5.0" | grep href |  awk -F\  '{print $3, $4}' | sort -n -t- -k3,3 -k2,2M -k1,1n | tail -1`
        - LATEST_VER=`curl -S $BASE_URL 2> /dev/null | grep "$LATEST_DATE_TIME" | awk -F'["/]' '{print $2}'`
        - echo ${LATEST_DATE_TIME} ${LATEST_VER} ${BASE_URL}${LATEST_VER}/debug_cudnn-linux-x86_64-${LATEST_VER}.tar.gz
        - wget -q --password ${JFROG_API_KEY} ${BASE_URL}${LATEST_VER}/debug_cudnn-linux-x86_64-${LATEST_VER}.tar.gz -O cudnn.tar.gz
        - tar xvf cudnn.tar.gz --directory /
        - export CUDNN_PATH=/debug_cudnn # This is required for source building FE
        - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/debug_cudnn/lib64 # This is required for dlopening BE

.cudnn_dev_image:template:
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_12.6.0

.cudnn_rel_image:template:
    image: gitlab-master.nvidia.com:5005/cudnn/cudnn_frontend:cudnn_12.6.0

.build:template:
    script:
        - ci/build.sh
    # keep the build directory so that later jobs can use it
    artifacts:
        paths:
            - build/

.cpp_samples:template:
    stage: cpp_samples
    script:
        - ci/run_cpp_samples.sh
    # Upload test report to gitlab
    artifacts:
        when: always
        reports:
            junit: build/result-junit.xml
        expire_in: 1 week

.python_tests:template:
    stage: python_tests
    script:
        - ci/run_python_tests.sh

.pycudnntest:template:
    stage: pycudnnTest
    script:
        - ci/run_pycudnntest.sh

.cpp_tests:template:
    stage: cpp_tests
    script:
        - ci/run_cpp_tests.sh

.python_samples:template:
    stage: python_samples
    script:
        - pip install -v .
        - ci/run_python_samples.sh

.L4_graph_runner:template:
